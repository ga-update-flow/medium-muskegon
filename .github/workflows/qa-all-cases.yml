# Live QA of every test case in this repo.
# For each case-* branch, one after another: publish it, then check the LIVE site against the branch:
#   - every changed/added file is live and byte-identical to the branch, a removed page returns 404;
#   - control pages that must not change (home, grants) are byte-identical to the baseline.
# Finally the baseline (main) is published again. Results are in the run summary.
name: QA all cases

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      cases: ${{ steps.m.outputs.cases }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: m
        run: |
          cases=$(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/case-*' | sed 's#^origin/##' | sort | jq -R -s -c 'split("\n") | map(select(length>0))')
          echo "cases=$cases" >> "$GITHUB_OUTPUT"
          echo "$cases"

  qa:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        case: ${{ fromJSON(needs.list.outputs.cases) }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.case }}
          fetch-depth: 0
      - name: Stage site files only
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ matrix.case }}
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ matrix.case }}
      - name: Verify the live site against this branch
        env:
          BASE: ${{ steps.deployment.outputs.page_url }}
          CASE: ${{ matrix.case }}
        run: |
          python3 - <<'PY'
          import os, subprocess, sys, time, random, hashlib, urllib.request, urllib.error, urllib.parse
          base = os.environ['BASE'].rstrip('/') + '/'
          case = os.environ['CASE']
          def sh(*a):
              return subprocess.run(a, capture_output=True, text=True, check=True).stdout
          changes = [l.split('\t', 1) for l in sh('git', '-c', 'core.quotepath=false', 'diff', '--name-status', '--no-renames', 'baseline-v1', 'HEAD').splitlines()]
          def url_for(path):
              if path == 'index.html':
                  rel = ''
              elif path.endswith('/index.html'):
                  rel = path[:-len('index.html')]
              else:
                  rel = path
              return base + urllib.parse.quote(rel, safe='/')
          def fetch(url):
              u = url + ('&' if '?' in url else '?') + 'qa=%d' % random.randint(1, 10**9)
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'case-qa', 'Cache-Control': 'no-cache'}), timeout=60)
                  return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, b''
              except Exception:
                  return 0, b''
          def wait_for(url, test, tries=24):
              last = None
              for _ in range(tries):
                  st, body = fetch(url)
                  last = (st, len(body))
                  if test(st, body):
                      return True, last
                  time.sleep(10)
              return False, last
          results = []
          ok = True
          for st, path in changes:
              url = url_for(path)
              if st == 'D':
                  passed, last = wait_for(url, lambda s, b: s == 404)
                  what = 'removed page returns 404'
              else:
                  want = open(path, 'rb').read()
                  passed, last = wait_for(url, lambda s, b, want=want: s == 200 and hashlib.sha256(b).digest() == hashlib.sha256(want).digest())
                  what = ('changed' if st == 'M' else 'added') + ' file is live and identical to the branch'
              results.append((passed, what, path, last))
              ok = ok and passed
          changed_paths = set(p for _, p in changes)
          for path in ['index.html', 'grants/index.html']:
              if path in changed_paths or not os.path.exists(path):
                  continue
              want = open(path, 'rb').read()
              passed, last = wait_for(url_for(path), lambda s, b, want=want: s == 200 and b == want, tries=3)
              results.append((passed, 'unchanged control page identical to baseline', path, last))
              ok = ok and passed
          lines = ['### %s: %s' % (case, 'PASS' if ok else 'FAIL')]
          for p, w, path, last in results:
              lines.append('- %s %s: `%s` %s' % ('PASS' if p else 'FAIL', w, path, '' if p else last))
          print('\n'.join(lines))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n'.join(lines) + '\n')
          sys.exit(0 if ok else 1)
          PY

  restore:
    needs: qa
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Stage site files only
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-restore
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-restore
